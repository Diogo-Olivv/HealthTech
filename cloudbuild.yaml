substitutions:
  _AR_REGION: "southamerica-east1"
  _BACKEND_REGION: "southamerica-east1"
  _FRONTEND_REGION: "us-central1"
  _AR_REPO: "healthtech"
  _BACKEND_SERVICE: "healthtech-backend"
  _FRONTEND_SERVICE: "healthtech-frontend-us"
  _CR_SA: "healthtech-cloudrun@health-tech-ai-lab.iam.gserviceaccount.com"
  _BACKEND_URL: "https://healthtech-backend-fc4ag5x3oq-rj.a.run.app"
  _CLOUDSQL_CONNECTION: "health-tech-ai-lab:southamerica-east1:health-tech-db"
  _MIGRATIONS_JOB: "healthtech-migrations"
  _NODE_IMAGE: "node:22-alpine"

steps:
  # ============================================================
  # ETAPA 1 - Instalação de dependências (paralelo)
  # node_modules fica em /workspace e é reutilizado pelos steps
  # seguintes, evitando reinstalar em cada job.
  # ============================================================
  - name: "${_NODE_IMAGE}"
    id: "install-backend"
    waitFor: ["-"]
    dir: "backend"
    entrypoint: "npm"
    args: ["ci", "--no-audit", "--no-fund", "--prefer-offline"]

  - name: "${_NODE_IMAGE}"
    id: "install-frontend"
    waitFor: ["-"]
    dir: "frontend"
    entrypoint: "npm"
    args: ["ci", "--no-audit", "--no-fund", "--prefer-offline"]

  # ============================================================
  # ETAPA 2 - Lint (auto-fix, NÃO bloqueia) + Testes (bloqueiam)
  #
  # Filosofia: lint = estilo, teste = correção.
  # - Lint roda com --fix e "|| true": tenta consertar o que der,
  #   reporta o que sobrou no log e SEGUE o pipeline. Não cancela
  #   o deploy por causa de style/formatting.
  # - Testes continuam sendo gate: se um teste falhar, o pipeline
  #   aborta antes de subir imagem para o Artifact Registry.
  # ============================================================
  - name: "${_NODE_IMAGE}"
    id: "lint-backend"
    waitFor: ["install-backend"]
    dir: "backend"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        echo "::: rodando eslint --fix no backend (não-bloqueante) :::"
        npx eslint "{src,apps,libs,test}/**/*.ts" --fix || \
          echo "AVISO: eslint reportou problemas no backend. Deploy segue, mas revise depois."
        exit 0

  - name: "${_NODE_IMAGE}"
    id: "test-backend"
    waitFor: ["install-backend"]
    dir: "backend"
    entrypoint: "npm"
    env:
      - "CI=true"
      - "NODE_ENV=test"
    args: ["test", "--", "--ci", "--passWithNoTests"]

  - name: "${_NODE_IMAGE}"
    id: "lint-frontend"
    waitFor: ["install-frontend"]
    dir: "frontend"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        echo "::: rodando eslint --fix no frontend (não-bloqueante) :::"
        npx eslint . --fix || \
          echo "AVISO: eslint reportou problemas no frontend. Deploy segue, mas revise depois."
        exit 0

  - name: "${_NODE_IMAGE}"
    id: "test-frontend"
    waitFor: ["install-frontend"]
    dir: "frontend"
    entrypoint: "npm"
    env:
      - "CI=true"
    args: ["test", "--", "--ci", "--passWithNoTests"]

  # ============================================================
  # ETAPA 3 - Autenticação Docker (paralelo ao CI)
  # ============================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "auth-docker"
    waitFor: ["-"]
    entrypoint: "gcloud"
    args:
      - "auth"
      - "configure-docker"
      - "${_AR_REGION}-docker.pkg.dev"
      - "--quiet"

  # ============================================================
  # ETAPA 4 - Build das imagens (só após lint + testes)
  # ============================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    # Depende do lint só para esperar o --fix rodar (não bloqueia por falha).
    waitFor: ["auth-docker", "lint-backend", "test-backend"]
    args:
      - "build"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest"
      - "./backend"

  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    waitFor: ["auth-docker", "lint-frontend", "test-frontend"]
    args:
      - "build"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_BACKEND_URL}"
      - "./frontend"

  # ============================================================
  # ETAPA 5 - Push em paralelo
  # ============================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    args:
      - "push"
      - "--all-tags"
      - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    waitFor: ["build-frontend"]
    args:
      - "push"
      - "--all-tags"
      - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend"

  # ============================================================
  # ETAPA 6 - Migrations
  # ============================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-migrations-job"
    waitFor: ["push-backend"]
    timeout: "300s"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "${_MIGRATIONS_JOB}"
      - "--image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID"
      - "--region=${_BACKEND_REGION}"
      - "--service-account=${_CR_SA}"
      - "--set-cloudsql-instances=${_CLOUDSQL_CONNECTION}"
      - "--set-env-vars=NODE_ENV=production,INSTANCE_CONNECTION_NAME=${_CLOUDSQL_CONNECTION}"
      - "--set-secrets=DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,DB_NAME=db-name:latest"
      - "--command=node"
      - "--args=node_modules/typeorm/cli.js,migration:run,-d,dist/data-source.js"
      - "--max-retries=1"
      - "--task-timeout=600s"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "run-migrations"
    waitFor: ["deploy-migrations-job"]
    timeout: "600s"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "execute"
      - "${_MIGRATIONS_JOB}"
      - "--region=${_BACKEND_REGION}"
      - "--wait"

  # ============================================================
  # ETAPA 7 - Deploy backend
  # ============================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["run-migrations"]
    timeout: "300s"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_BACKEND_SERVICE}"
      - "--image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID"
      - "--region=${_BACKEND_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=${_CR_SA}"
      - "--port=3001"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--add-cloudsql-instances=${_CLOUDSQL_CONNECTION}"
      - "--set-env-vars=NODE_ENV=production,INSTANCE_CONNECTION_NAME=${_CLOUDSQL_CONNECTION}"
      - "--set-secrets=JWT_SECRET=jwt-secret:latest,DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,DB_NAME=db-name:latest,GCS_BUCKET_NAME=gcs-bucket-name:latest,FRONTEND_URL=frontend-url:latest"

  # ============================================================
  # ETAPA 8 - Deploy frontend
  # ============================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    waitFor: ["push-frontend", "deploy-backend"]
    timeout: "300s"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_FRONTEND_SERVICE}"
      - "--image=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID"
      - "--region=${_FRONTEND_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=${_CR_SA}"
      - "--port=3000"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--set-env-vars=NODE_ENV=production,API_INTERNAL_URL=${_BACKEND_URL}"

images:
  - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID"
  - "${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
